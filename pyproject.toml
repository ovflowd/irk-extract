[project]
name = "irk-extract"
version = "0.1.0"
description = "Get a Bluetooth LE device's IRK out of an iPhone bond over USB, no jailbreak needed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Claudio Wunder", email = "cwunder@gnome.org" }]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "rich>=13.7",
]
keywords = ["bluetooth", "irk", "home-assistant", "iphone", "ble", "privacy"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/ovflowd/irk-extract"

[project.scripts]
irk-extract = "irk_extract:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["irk_extract"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["irk_extract", "synth"]
